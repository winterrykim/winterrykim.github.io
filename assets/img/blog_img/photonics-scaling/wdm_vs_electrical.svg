<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Electrical lanes compared with optical wavelength-division multiplexing</title>
  <desc id="desc">The left panel shows four electrical signals using four physical lanes. The right panel shows four wavelength channels combined into one optical waveguide and separated again.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafb"/>
    </linearGradient>
    <marker id="arrow-gray-1" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 Z" fill="#52616b"/>
    </marker>
    <marker id="arrow-gray-2" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 Z" fill="#697780"/>
    </marker>
    <marker id="arrow-gray-3" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 Z" fill="#859199"/>
    </marker>
    <marker id="arrow-gray-4" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="16" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 Z" fill="#a1aab0"/>
    </marker>
    <style>
      .title { font: 700 45px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .panel-title { font: 700 31px Arial, Helvetica, sans-serif; fill: #283640; letter-spacing: 0.8px; }
      .label { font: 600 24px Arial, Helvetica, sans-serif; fill: #34444f; }
      .small { font: 400 21px Arial, Helvetica, sans-serif; fill: #5d6872; }
      .note { font: 400 20px Arial, Helvetica, sans-serif; fill: #5d6872; }
      .lambda { font: 700 21px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="800" y="72" text-anchor="middle" class="title">Two ways to add aggregate bandwidth</text>

  <rect x="55" y="115" width="710" height="600" rx="28" fill="url(#panel)" stroke="#cfd8dc" stroke-width="3"/>
  <rect x="835" y="115" width="710" height="600" rx="28" fill="url(#panel)" stroke="#b6a7ef" stroke-width="3"/>

  <text x="410" y="170" text-anchor="middle" class="panel-title">ELECTRICAL</text>
  <text x="1190" y="170" text-anchor="middle" class="panel-title">OPTICAL WDM</text>

  <rect x="105" y="230" width="155" height="350" rx="22" fill="#eef2f4" stroke="#7a8790" stroke-width="3"/>
  <text x="182" y="380" text-anchor="middle" class="label">TX</text>
  <text x="182" y="416" text-anchor="middle" class="small">electrical</text>

  <rect x="560" y="230" width="155" height="350" rx="22" fill="#eef2f4" stroke="#7a8790" stroke-width="3"/>
  <text x="637" y="380" text-anchor="middle" class="label">RX</text>
  <text x="637" y="416" text-anchor="middle" class="small">electrical</text>

  <line x1="260" y1="285" x2="558" y2="285" stroke="#52616b" stroke-width="10" marker-end="url(#arrow-gray-1)"/>
  <line x1="260" y1="365" x2="558" y2="365" stroke="#697780" stroke-width="10" marker-end="url(#arrow-gray-2)"/>
  <line x1="260" y1="445" x2="558" y2="445" stroke="#859199" stroke-width="10" marker-end="url(#arrow-gray-3)"/>
  <line x1="260" y1="525" x2="558" y2="525" stroke="#a1aab0" stroke-width="10" marker-end="url(#arrow-gray-4)"/>
  <text x="410" y="630" text-anchor="middle" class="label">Four signals, four physical lanes</text>
  <text x="410" y="665" text-anchor="middle" class="small">Scale with more traces, faster signaling, or both</text>

  <rect x="890" y="230" width="135" height="350" rx="22" fill="#f4f1ff" stroke="#6d4fe0" stroke-width="3"/>
  <text x="957.5" y="380" text-anchor="middle" class="label">MUX</text>
  <text x="957.5" y="416" text-anchor="middle" class="small">combine</text>

  <rect x="1355" y="230" width="135" height="350" rx="22" fill="#f4f1ff" stroke="#6d4fe0" stroke-width="3"/>
  <text x="1422.5" y="380" text-anchor="middle" class="label">DEMUX</text>
  <text x="1422.5" y="416" text-anchor="middle" class="small">separate</text>

  <text x="858" y="307" text-anchor="middle" class="lambda" fill="#2f80ed">λ1</text>
  <text x="858" y="377" text-anchor="middle" class="lambda" fill="#20a779">λ2</text>
  <text x="858" y="447" text-anchor="middle" class="lambda" fill="#d64f9d">λ3</text>
  <text x="858" y="517" text-anchor="middle" class="lambda" fill="#d98b19">λ4</text>
  <line x1="875" y1="300" x2="890" y2="300" stroke="#2f80ed" stroke-width="8"/>
  <line x1="875" y1="370" x2="890" y2="370" stroke="#20a779" stroke-width="8"/>
  <line x1="875" y1="440" x2="890" y2="440" stroke="#d64f9d" stroke-width="8"/>
  <line x1="875" y1="510" x2="890" y2="510" stroke="#d98b19" stroke-width="8"/>

  <rect x="1025" y="342" width="330" height="126" rx="63" fill="#eef7ff" stroke="#5540c9" stroke-width="4"/>
  <line x1="1028" y1="372" x2="1352" y2="372" stroke="#2f80ed" stroke-width="8"/>
  <line x1="1028" y1="394" x2="1352" y2="394" stroke="#20a779" stroke-width="8"/>
  <line x1="1028" y1="416" x2="1352" y2="416" stroke="#d64f9d" stroke-width="8"/>
  <line x1="1028" y1="438" x2="1352" y2="438" stroke="#d98b19" stroke-width="8"/>
  <text x="1190" y="520" text-anchor="middle" class="label">One physical waveguide</text>
  <text x="1190" y="552" text-anchor="middle" class="small">Four independently modulated</text>
  <text x="1190" y="578" text-anchor="middle" class="small">wavelengths</text>

  <line x1="1490" y1="300" x2="1520" y2="300" stroke="#2f80ed" stroke-width="8"/>
  <line x1="1490" y1="370" x2="1520" y2="370" stroke="#20a779" stroke-width="8"/>
  <line x1="1490" y1="440" x2="1520" y2="440" stroke="#d64f9d" stroke-width="8"/>
  <line x1="1490" y1="510" x2="1520" y2="510" stroke="#d98b19" stroke-width="8"/>

  <text x="1190" y="630" text-anchor="middle" class="label">Wavelength adds another channel dimension</text>
  <text x="1190" y="665" text-anchor="middle" class="small">Capacity depends on the full optical link and channel spacing</text>

  <line x1="120" y1="760" x2="1480" y2="760" stroke="#d7dee2" stroke-width="2"/>
  <text x="800" y="797" text-anchor="middle" class="note">Electrical links also use multilevel modulation; the comparison isolates the physical-lane advantage of WDM.</text>
</svg>
